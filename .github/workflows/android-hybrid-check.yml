name: Android Hybrid Assistant - build and tests

on:
  pull_request:
    paths:
      - 'android/app/src/main/**'
      - 'android/app/src/test/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/android-hybrid-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-hybrid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

      - name: Enable documented premium developer mode for this test APK
        run: |
          # Local-only opt-in. Never commit the token file or ship this in release.
          printf '%s\n' 'DEBUG_PREMIUM=true' > android/local.properties

      - name: Kotlin unit tests and Android debug build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug -PpersonalHybridBuild=true --no-daemon --stacktrace

      - name: Upload test APK only after success
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Hub-Hybrid-Phase1-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 2
